name: anvil
version: 0.1.0

description: |
  Terminal UI library for Crystal with two modes of operation: fullscreen
  (alternate screen, 30/60 fps) and inline (the scrollback stays; only a live
  region at the bottom is redrawn).

authors:
  - Mathias Karstaedt <mathias.karstaedt@gmail.com>

crystal: ">= 1.17.0"

license: MIT

dependencies:
  termisu:
    github: omarluq/termisu

development_dependencies:
  crysterm:
    github: crystallabs/crysterm
  crystal_tui:
    github: skuznetsov/crystal_tui
